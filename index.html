<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Body Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }

  :root {
    --paper: #FFF8F1;
    --ink: #4A3B3E;
    --ink-soft: #9A8A8D;
    --thread: #FF8FA3;
    --thread-deep: #FF6F8E;
    --brass: #FFC98B;
    --coral: #FFB4A2;
    --lavender: #C9B8E8;
    --mint: #A8E6CF;
    --kraft: #FDE8EF;
    --kraft-line: #F3D9E4;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    overflow-x: hidden;
    background: var(--paper);
    font-family: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    padding: 40px 16px 48px;
  }

  /* soft floating blobs for depth, purely decorative */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(50px);
    z-index: -1;
    opacity: 0.55;
  }
  body::before {
    width: 320px;
    height: 320px;
    top: -80px;
    left: -100px;
    background: var(--mint);
  }
  body::after {
    width: 380px;
    height: 380px;
    bottom: -120px;
    right: -120px;
    background: var(--lavender);
  }

  .eyebrow {
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--thread-deep);
    margin: 0 0 6px;
  }

  h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 38px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: -0.5px;
    color: var(--thread-deep);
  }

  p.sub {
    margin: 0 0 26px;
    font-size: 15px;
    font-weight: 600;
    color: var(--ink-soft);
  }

  .stage-wrap {
    position: relative;
    width: 320px;
    height: 640px;
    background: #ffffff;
    border-radius: 32px;
    box-shadow:
      0 2px 6px rgba(255,143,163,0.10),
      0 18px 40px rgba(255,143,163,0.22);
    overflow: hidden;
  }

  .stage-wrap::after {
    content: '';
    position: absolute;
    top: -18px; right: -18px;
    width: 70px; height: 70px;
    border-radius: 50%;
    background: var(--brass);
    opacity: 0.5;
    z-index: -1;
    pointer-events: none;
  }

  #silhouette {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  #drawCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
  }

  .toolbar-label {
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 22px 0 8px;
    width: 320px;
  }

  .toolbar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: flex-start;
    width: 320px;
    background: #fff;
    border: 2px solid var(--kraft-line);
    border-radius: 20px;
    padding: 8px;
  }

  button, .tool-btn {
    border: none;
    background: transparent;
    color: var(--ink);
    padding: 9px 14px;
    border-radius: 999px;
    font-family: 'Quicksand', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, transform 0.15s cubic-bezier(.34,1.56,.64,1);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tool-btn:hover { background: var(--kraft); transform: scale(1.04); }
  button:active { transform: scale(0.94); }

  .tool-btn.active {
    background: var(--thread);
    color: #fff;
  }

  .tool-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .row2 {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    width: 320px;
    justify-content: space-between;
    flex-wrap: wrap;
  }

  .size-control {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border: 2px solid var(--kraft-line);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 11px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  input[type="range"] {
    width: 80px;
    accent-color: var(--thread);
  }

  .swatch {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid #fff;
    box-shadow: 0 0 0 2px var(--kraft-line), inset 0 0 0 1px rgba(255,255,255,0.4);
    cursor: pointer;
    transition: transform 0.15s cubic-bezier(.34,1.56,.64,1);
  }
  .swatch:hover { transform: scale(1.15); }
  .swatch.active { box-shadow: 0 0 0 3px var(--thread-deep); }

  .texture-swatch {
    width: 18px;
    height: 18px;
    border-radius: 6px;
    display: inline-block;
    box-shadow: 0 0 0 1px var(--kraft-line);
    flex-shrink: 0;
  }
  .texture-solid { background: var(--thread); }
  .texture-linen {
    background:
      repeating-linear-gradient(0deg, rgba(74,59,62,0.22) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(90deg, rgba(74,59,62,0.22) 0 1px, transparent 1px 4px),
      #f3e6da;
  }
  .texture-lace {
    background:
      radial-gradient(circle, rgba(74,59,62,0.45) 1px, transparent 1.4px) 0 0 / 6px 6px,
      #fbeef2;
  }
  .texture-sequins {
    background:
      radial-gradient(circle at 30% 30%, #fff 0%, var(--brass) 45%, #cf8f3f 100%) 0 0 / 8px 8px,
      radial-gradient(circle at 30% 30%, #fff 0%, var(--brass) 45%, #cf8f3f 100%) 4px 4px / 8px 8px;
  }
  .texture-btn.active { background: var(--kraft); color: var(--ink); box-shadow: inset 0 0 0 2px var(--thread-deep); }

  .colors {
    display: flex;
    gap: 7px;
    background: #fff;
    border: 2px solid var(--kraft-line);
    padding: 8px 12px;
    border-radius: 999px;
  }

  #customColor {
    width: 22px !important;
    height: 22px !important;
    min-width: 22px;
    border: none !important;
    border-radius: 50% !important;
    box-shadow: 0 0 0 2px var(--kraft-line);
    cursor: pointer;
    padding: 0 !important;
    background: #fff;
    appearance: none;
    -webkit-appearance: none;
  }
  #customColor::-webkit-color-swatch-wrapper { padding: 0; }
  #customColor::-webkit-color-swatch { border: none; border-radius: 50%; }

  #findBtn {
    margin-top: 22px;
    width: 320px;
    background: var(--thread);
    color: #fff;
    padding: 16px 34px;
    font-family: 'Fredoka', sans-serif;
    font-size: 18px;
    font-weight: 600;
    border-radius: 999px;
    box-shadow: 0 8px 20px rgba(255,111,142,0.35);
    letter-spacing: 0.2px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), background 0.15s ease;
  }
  #findBtn:hover { background: var(--thread-deep); transform: scale(1.04) translateY(-2px); }
  #findBtn:active { transform: scale(0.96); }
  #findBtn:disabled { opacity: 0.6; }

  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--thread-deep);
    color: #fff;
    padding: 10px 20px;
    border-radius: 999px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 13px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  svg text { user-select: none; }

  .hangtag {
    width: 320px;
    margin-top: 16px;
    background: #fff;
    border: 2px solid var(--kraft-line);
    border-radius: 24px;
    padding: 20px;
    position: relative;
    box-shadow: 0 6px 20px rgba(255,143,163,0.14);
  }
  .hangtag-empty {
    margin: 0;
    color: var(--ink-soft);
    font-weight: 600;
    font-size: 14px;
  }
  .hangtag-type {
    display: inline-block;
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    background: var(--thread);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 700;
    margin-bottom: 8px;
  }
  .hangtag-desc {
    font-family: 'Fredoka', sans-serif;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 12px;
    line-height: 1.3;
  }
  .hangtag-links {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .hangtag-links a {
    font-family: 'Quicksand', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.2px;
    padding: 7px 12px;
    background: var(--paper);
    border: 2px solid var(--kraft-line);
    border-radius: 999px;
    color: var(--ink);
    text-decoration: none;
  }
  .hangtag-links a:hover { background: var(--kraft); }
  .hangtag-item + .hangtag-item {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 2px dashed var(--kraft-line);
  }

  /* left tool panel + figure, side by side to keep the page short */
  .hero {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 22px;
    flex-wrap: wrap;
  }

  .side-panel {
    width: 190px;
    background: #fff;
    border: 2px solid var(--kraft-line);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 0 4px 16px rgba(255,143,163,0.10);
  }

  .panel-label {
    font-family: 'Quicksand', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--ink-soft);
    margin: 14px 0 6px;
  }
  .panel-label:first-child { margin-top: 0; }

  .toolbar-vertical {
    flex-direction: column;
    align-items: stretch;
    width: 100%;
    gap: 4px;
  }
  .toolbar-vertical.toolbar { padding: 6px; }
  .toolbar-vertical .tool-btn,
  .toolbar-vertical button {
    width: 100%;
    justify-content: flex-start;
  }

  .size-control-vertical {
    width: 100%;
    background: #fff;
    border: 2px solid var(--kraft-line);
    padding: 8px 12px;
    border-radius: 999px;
  }
  .size-control-vertical input[type="range"] { width: 100%; }

  .colors-vertical {
    flex-wrap: wrap;
    width: 100%;
  }
  .colors-vertical .swatch { width: 22px; height: 22px; }

  /* Find It, with a cascading bunch of bouncy little blooms trailing down one side */
  .bloom-wrap {
    position: relative;
    margin-top: 44px;
    width: 320px;
    margin-left: auto;
    margin-right: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .bloom {
    position: absolute;
    width: 210px;
    height: 320px;
    right: -18px;
    top: -128px;
    pointer-events: none;
    z-index: 0;
    transform-origin: 65% 18%;
    animation: bloomBounceIn 1.1s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay: 0.2s;
  }
  @keyframes bloomBounceIn {
    0%   { transform: scale(0) rotate(-18deg); opacity: 0; }
    55%  { transform: scale(1.18) rotate(6deg); opacity: 1; }
    75%  { transform: scale(0.94) rotate(-3deg); }
    100% { transform: scale(1) rotate(0deg); }
  }
  #findBtn { position: relative; z-index: 1; }

  /* paywall mockup */
  .paywall-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(32,28,24,0.55);
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .paywall-overlay.show { display: flex; }

  .paywall-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    background: var(--paper);
    border: 2px solid var(--kraft-line);
    border-radius: 28px;
    padding: 26px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .paywall-close {
    position: absolute;
    top: 14px;
    right: 16px;
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--ink-soft);
    cursor: pointer;
    padding: 4px;
  }
  .paywall-close:hover { color: var(--ink); }

  .paywall-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 10px;
    color: var(--thread-deep);
  }

  .paywall-price {
    margin: 0 0 10px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    color: var(--thread);
  }
  .paywall-price span {
    font-size: 22px;
    font-weight: 700;
  }

  .paywall-desc {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin: 0 0 18px;
    line-height: 1.4;
  }

  .paywall-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    margin-bottom: 12px;
    flex: 1;
  }
  .paywall-field label {
    font-family: 'Quicksand', sans-serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-soft);
  }
  .paywall-field input {
    border: 2px solid var(--kraft-line);
    border-radius: 14px;
    padding: 10px 14px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 14px;
    background: #fff;
    color: var(--ink);
  }
  .paywall-field input:focus {
    outline: none;
    border-color: var(--thread);
  }

  .paywall-row {
    display: flex;
    gap: 10px;
  }

  #paywallPayBtn {
    width: 100%;
    background: var(--thread);
    color: #fff;
    border: none;
    padding: 14px;
    border-radius: 999px;
    font-family: 'Fredoka', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    transition: transform 0.2s cubic-bezier(.34,1.56,.64,1), background 0.15s ease;
  }
  #paywallPayBtn:hover { background: var(--thread-deep); transform: scale(1.03); }
  #paywallPayBtn:disabled { opacity: 0.6; cursor: default; }

  .paywall-note {
    text-align: center;
    font-size: 11px;
    color: var(--ink-soft);
    margin: 10px 0 0;
  }
</style>
</head>
<body>

<p class="eyebrow">Sketch → Identify → Shop</p>
<h1>Styli</h1>
<p class="sub">Envision your next wear.</p>

<div class="hero">

  <div class="side-panel">
    <p class="panel-label">Tools</p>
    <div class="toolbar toolbar-vertical">
      <button class="tool-btn active" id="penBtn">✏️ Pen</button>
      <button class="tool-btn" id="eraserBtn">🧽 Eraser</button>
      <button id="undoBtn">↩️ Undo</button>
      <button id="clearBtn">🗑️ Clear</button>
    </div>

    <p class="panel-label">Size</p>
    <div class="size-control size-control-vertical">
      <input type="range" id="sizeSlider" min="2" max="30" value="6">
    </div>

    <p class="panel-label">Color</p>
    <div class="colors colors-vertical" id="colorRow">
      <div class="swatch active" data-color="#c0392b" style="background:#c0392b"></div>
      <div class="swatch" data-color="#2b2b2b" style="background:#2b2b2b"></div>
      <div class="swatch" data-color="#2e86de" style="background:#2e86de"></div>
      <div class="swatch" data-color="#27ae60" style="background:#27ae60"></div>
      <div class="swatch" data-color="#f39c12" style="background:#f39c12"></div>
      <input type="color" id="customColor" value="#c0392b" title="Choose a custom color">
    </div>

    <p class="panel-label">Texture</p>
    <div class="toolbar toolbar-vertical" id="textureRow">
      <button class="tool-btn texture-btn active" data-texture="solid">
        <span class="texture-swatch texture-solid"></span> Solid
      </button>
      <button class="tool-btn texture-btn" data-texture="linen">
        <span class="texture-swatch texture-linen"></span> Linen
      </button>
      <button class="tool-btn texture-btn" data-texture="lace">
        <span class="texture-swatch texture-lace"></span> Lace
      </button>
      <button class="tool-btn texture-btn" data-texture="sequins">
        <span class="texture-swatch texture-sequins"></span> Sequins
      </button>
    </div>
  </div>

  <div class="stage-wrap" id="stageWrap">
<svg id="silhouette" viewBox="0 0 320 640" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="160" cy="40" rx="20" ry="24" fill="#FBD9C9"/>

</div>

<div class="bloom-wrap">
  <svg class="bloom" viewBox="0 0 210 320" xmlns="http://www.w3.org/2000/svg">
    <g id="bloomPetals"></g>
  </svg>
  <button id="findBtn">Find It</button>

<div class="toast" id="toast">Saved!</div>

<div class="paywall-overlay" id="paywallOverlay">
  <div class="paywall-card">
    <button class="paywall-close" id="paywallClose" aria-label="Close">&times;</button>
    <p class="panel-label" style="margin-top:0;">Unlock This Match</p>
    <h2 class="paywall-title">See your shoppable results</h2>
    <p class="paywall-price"><span>$2.99</span> one-time</p>
    <p class="paywall-desc">Unlock this sketch's item breakdown and direct links to buy it, wherever it's sold.</p>

    <div class="paywall-field">
      <label>Card number</label>
      <input type="text" placeholder="4242 4242 4242 4242" inputmode="numeric" id="fakeCardNumber">
    </div>
    <div class="paywall-row">
      <div class="paywall-field">
        <label>Expiry</label>
        <input type="text" placeholder="MM / YY" id="fakeCardExpiry">
      </div>
      <div class="paywall-field">
        <label>CVC</label>
        <input type="text" placeholder="123" id="fakeCardCvc">
      </div>
    </div>

    <button id="paywallPayBtn">Pay $2.99</button>
    <p class="paywall-note">Test mode &mdash; no real payment is processed.</p>
  </div>
</div>

<script>
(function () {
  // Build a cascading trail of little bouncy blossoms behind the Find It button
  (function buildBloom() {
    const svgNS = 'http://www.w3.org/2000/svg';
    const group = document.getElementById('bloomPetals');
    if (!group) return;

    const PINK = '#FF8FA3';
    const LAVENDER = '#C9B8E8';
    const MINT = '#A8E6CF';
    const YELLOW = '#FFC98B';
    const CORAL = '#FFB4A2';
    const palette = [PINK, LAVENDER, MINT, YELLOW, CORAL];

    // A gentle curving cascade of blossom positions, biggest near the top,
    // shrinking as they trail down past the button.
    const cascade = [
      { x: 150, y: 26,  scale: 1.00 },
      { x: 175, y: 78,  scale: 0.86 },
      { x: 178, y: 134, scale: 0.72 },
      { x: 158, y: 186, scale: 0.58 },
      { x: 122, y: 226, scale: 0.46 },
      { x: 80,  y: 254, scale: 0.36 },
      { x: 40,  y: 272, scale: 0.26 }
    ];

    function makeBlossom(cx, cy, scale, color, index) {
      const g = document.createElementNS(svgNS, 'g');
      g.setAttribute('transform', `translate(${cx},${cy}) scale(${scale}) rotate(${(index * 37) % 360})`);

      // 5 round bouncy petals arranged around a center point
      const petalCount = 5;
      const petalR = 11;
      const orbit = 11;
      for (let i = 0; i < petalCount; i++) {
        const angle = (360 / petalCount) * i * (Math.PI / 180);
        const px = Math.cos(angle) * orbit;
        const py = Math.sin(angle) * orbit;
        const petal = document.createElementNS(svgNS, 'circle');
        petal.setAttribute('cx', px);
        petal.setAttribute('cy', py);
        petal.setAttribute('r', petalR);
        petal.setAttribute('fill', color);
        petal.setAttribute('opacity', '0.85');
        g.appendChild(petal);
      }

      // soft center
      const center = document.createElementNS(svgNS, 'circle');
      center.setAttribute('r', '6.5');
      center.setAttribute('fill', '#FFF3D6');
      g.appendChild(center);

      return g;
    }

    cascade.forEach((spot, i) => {
      const color = palette[i % palette.length];
      group.appendChild(makeBlossom(spot.x, spot.y, spot.scale, color, i));
    });

    // a couple of tiny loose petals scattered near the trail for extra whimsy
    const loose = [
      { x: 190, y: 50, r: 5, color: MINT },
      { x: 60,  y: 300, r: 4, color: PINK },
      { x: 105, y: 210, r: 4.5, color: YELLOW }
    ];
    loose.forEach(dot => {
      const c = document.createElementNS(svgNS, 'circle');
      c.setAttribute('cx', dot.x);
      c.setAttribute('cy', dot.y);
      c.setAttribute('r', dot.r);
      c.setAttribute('fill', dot.color);
      c.setAttribute('opacity', '0.7');
      group.appendChild(c);
    });
  })();

  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');

  const W = 320, H = 640;
  canvas.width = W;
  canvas.height = H;

  let drawing = false;
  let tool = 'pen';
  let color = '#c0392b';
  let lineWidth = 6;
  let last = null;
  let texture = 'solid';

  const textureNames = {
    solid: 'solid',
    linen: 'linen',
    lace: 'lace',
    sequins: 'sequins'
  };

  const undoStack = [];
  const MAX_UNDO = 30;

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  function pushUndoSnapshot() {
    try {
      const snap = ctx.getImageData(0, 0, W, H);
      undoStack.push(snap);
      if (undoStack.length > MAX_UNDO) undoStack.shift();
    } catch (e) { /* ignore */ }
  }

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const scaleY = H / rect.height;
    const point = e.touches ? e.touches[0] : e;
    return {
      x: (point.clientX - rect.left) * scaleX,
      y: (point.clientY - rect.top) * scaleY
    };
  }

  function startDraw(e) {
    e.preventDefault();
    pushUndoSnapshot();
    drawing = true;
    last = getPos(e);
    ctx.beginPath();
    ctx.arc(last.x, last.y, lineWidth / 2, 0, Math.PI * 2);
    ctx.fillStyle = tool === 'eraser' ? '#000000' : color;
    if (tool === 'eraser') {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.fill();
      ctx.restore();
    } else {
      ctx.fill();
    }
  }

  function moveDraw(e) {
    if (!drawing) return;
    e.preventDefault();

    const pos = getPos(e);

    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    if (tool === 'eraser') {
      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      ctx.restore();

    } else {
      ctx.save();
      ctx.globalCompositeOperation = 'source-over';

      if (texture === 'solid') {
        ctx.strokeStyle = color;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

      } else if (texture === 'linen') {
        ctx.strokeStyle = color;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.moveTo(last.x, last.y);
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();

        ctx.globalAlpha = 0.25;
        ctx.lineWidth = Math.max(1, lineWidth / 4);
        ctx.beginPath();
        ctx.moveTo(last.x + 2, last.y + 2);
        ctx.lineTo(pos.x + 2, pos.y + 2);
        ctx.stroke();

      } else if (texture === 'lace') {
        ctx.fillStyle = color;
        const distance = Math.max(3, lineWidth * 1.2);
        const dx = pos.x - last.x;
        const dy = pos.y - last.y;
        const length = Math.sqrt(dx * dx + dy * dy);
        const steps = Math.max(1, Math.floor(length / distance));

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = last.x + dx * t;
          const y = last.y + dy * t;
          ctx.beginPath();
          ctx.arc(x, y, Math.max(1, lineWidth / 4), 0, Math.PI * 2);
          ctx.fill();
        }

      } else if (texture === 'sequins') {
        ctx.fillStyle = color;
        const distance = Math.max(5, lineWidth * 1.5);
        const dx = pos.x - last.x;
        const dy = pos.y - last.y;
        const length = Math.sqrt(dx * dx + dy * dy);
        const steps = Math.max(1, Math.floor(length / distance));

        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const x = last.x + dx * t;
          const y = last.y + dy * t;

          ctx.beginPath();
          ctx.arc(x, y, Math.max(2, lineWidth / 2), 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(x - 1, y - 1, Math.max(0.7, lineWidth / 6), 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = color;
        }
      }

      ctx.restore();
    }

    last = pos;
  }

  function endDraw() {
    drawing = false;
    last = null;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', moveDraw);
  window.addEventListener('mouseup', endDraw);

  canvas.addEventListener('touchstart', startDraw, { passive: false });
  canvas.addEventListener('touchmove', moveDraw, { passive: false });
  canvas.addEventListener('touchend', endDraw);

  const penBtn = document.getElementById('penBtn');
  const eraserBtn = document.getElementById('eraserBtn');

  penBtn.addEventListener('click', () => {
    tool = 'pen';
    penBtn.classList.add('active');
    eraserBtn.classList.remove('active');
    canvas.style.cursor = 'crosshair';
  });

  eraserBtn.addEventListener('click', () => {
    tool = 'eraser';
    eraserBtn.classList.add('active');
    penBtn.classList.remove('active');
    canvas.style.cursor = 'cell';
  });

  const sizeSlider = document.getElementById('sizeSlider');
  sizeSlider.addEventListener('input', () => {
    lineWidth = parseInt(sizeSlider.value, 10);
  });

  const colorRow = document.getElementById('colorRow');
  colorRow.addEventListener('click', (e) => {
    const sw = e.target.closest('.swatch');
    if (!sw) return;
    color = sw.dataset.color;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    sw.classList.add('active');
    tool = 'pen';
    penBtn.classList.add('active');
    eraserBtn.classList.remove('active');
  });

  const textureRow = document.getElementById('textureRow');
  textureRow.addEventListener('click', (e) => {
    const btn = e.target.closest('.texture-btn');
    if (!btn) return;
    texture = btn.dataset.texture;
    document.querySelectorAll('.texture-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });

  const customColorInput = document.getElementById('customColor');
  customColorInput.addEventListener('input', () => {
    color = customColorInput.value;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
    tool = 'pen';
    penBtn.classList.add('active');
    eraserBtn.classList.remove('active');
  });

  document.getElementById('undoBtn').addEventListener('click', () => {
    if (undoStack.length === 0) return;
    const snap = undoStack.pop();
    ctx.putImageData(snap, 0, 0);
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    pushUndoSnapshot();
    ctx.clearRect(0, 0, W, H);
  });

  // Actual Find It logic, only runs after the mock paywall is cleared
  async function runFindIt() {
    const findBtn = document.getElementById('findBtn');

    findBtn.disabled = true;
    findBtn.textContent = 'Analyzing...';

    try {
      const svgEl = document.getElementById('silhouette');
      const svgData = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();

      img.onload = async function () {
        const out = document.createElement('canvas');
        out.width = W;
        out.height = H;
        const octx = out.getContext('2d');

        octx.fillStyle = '#ffffff';
        octx.fillRect(0, 0, W, H);
        octx.drawImage(img, 0, 0, W, H);
        octx.drawImage(canvas, 0, 0, W, H);

        URL.revokeObjectURL(url);

        const imageData = out.toDataURL('image/png');

        try {
          const response = await fetch('/analyze', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              image: imageData,
              texture: textureNames[texture]
            })
          });

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.error || 'Something went wrong.');
          }

          showResults(data.items || []);

        } catch (error) {
          console.error(error);
          alert('Error: ' + error.message);
        }

        findBtn.disabled = false;
        findBtn.textContent = 'Find It';
      };

      img.onerror = function () {
        throw new Error('Could not process the body image.');
      };

      img.src = url;

    } catch (error) {
      console.error(error);
      alert('Error: ' + error.message);
      findBtn.disabled = false;
      findBtn.textContent = 'Find It';
    }
  }

  // --- mock paywall gate ---
  let hasUnlocked = false;
  const paywallOverlay = document.getElementById('paywallOverlay');
  const paywallPayBtn = document.getElementById('paywallPayBtn');
  const paywallClose = document.getElementById('paywallClose');

  document.getElementById('findBtn').addEventListener('click', () => {
    if (hasUnlocked) {
      runFindIt();
    } else {
      paywallOverlay.classList.add('show');
    }
  });

  paywallClose.addEventListener('click', () => {
    paywallOverlay.classList.remove('show');
  });

  paywallOverlay.addEventListener('click', (e) => {
    if (e.target === paywallOverlay) paywallOverlay.classList.remove('show');
  });

  paywallPayBtn.addEventListener('click', () => {
    // Mock payment: no real card is charged, no real processor is called.
    paywallPayBtn.disabled = true;
    paywallPayBtn.textContent = 'Processing...';

    setTimeout(() => {
      hasUnlocked = true;
      paywallOverlay.classList.remove('show');
      paywallPayBtn.disabled = false;
      paywallPayBtn.textContent = 'Pay $2.99';
      runFindIt();
    }, 900);
  });

  function shopLinks(query) {
    const q = encodeURIComponent(query);
    return [
      { label: 'Google Shopping', url: `https://www.google.com/search?tbm=shop&q=${q}` },
      { label: 'Zara', url: `https://www.zara.com/us/en/search?searchTerm=${q}` },
      { label: 'H&M', url: `https://www2.hm.com/en_us/search-results.html?q=${q}` },
      { label: 'ASOS', url: `https://www.asos.com/us/search/?q=${q}` }
    ];
  }

  function showResults(items) {
    const existing = document.getElementById('resultsPanel');
    if (existing) existing.remove();

    const panel = document.createElement('div');
    panel.id = 'resultsPanel';
    panel.className = 'hangtag';

    if (items.length === 0) {
      panel.innerHTML = `<p class="hangtag-empty">Didn't see anything drawn yet, try sketching an outfit first.</p>`;
    } else {
      panel.innerHTML = items.map(item => `
        <div class="hangtag-item">
          <div class="hangtag-type">${item.type}</div>
          <div class="hangtag-desc">${item.description}</div>
          <div class="hangtag-desc" style="font-size:13px; margin-top:-6px;">
            Texture: ${textureNames[texture]}
          </div>
          <div class="hangtag-links">
            ${shopLinks(`${textureNames[texture]} ${item.description}`).map(l => `
              <a href="${l.url}" target="_blank" rel="noopener">${l.label}</a>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    document.getElementById('findBtn').insertAdjacentElement('afterend', panel);
  }

})();
</script>
